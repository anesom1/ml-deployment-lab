# Docker Compose file format
version: "3.8"

# Define all containers/services used by our application
services:

  # Our FastAPI application
  api:
    
    # Build the Docker image using our Dockerfile
    build:
      context: .
      dockerfile: api/Dockerfile

    # Give the container a name
    container_name: ml_api

    # Automatically restart the container if it stops
    restart: always

    # Map computer port 8000 → container port 8000
    ports:
      - "8000:8000"

    # Pass environment variables into the API container
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Start API only after PostgreSQL is ready
    depends_on:
      db:
        condition: service_healthy


  # Our PostgreSQL database
  db:

    # Use the official PostgreSQL Docker image
    image: postgres:16

    # Give the database container a name
    container_name: postgres

    # Automatically restart the container if it stops
    restart: always

    # PostgreSQL configuration
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Connect files/volumes to the database container
    volumes:

      # Store database data permanently
      - db_data:/var/lib/postgresql/data

      # Run our SQL file when PostgreSQL initializes
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    # Check if PostgreSQL is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:  
      - "8080:8080"
    depends_on:
      - db

# Define named volumes
volumes:

  # Persistent storage for PostgreSQL
  db_data: